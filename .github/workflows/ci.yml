name: CI

# Spec 003. Job names are stable on purpose: they become required checks.
on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so the owner's `no-test-needed` waiver re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The build reads the catalog from the database to fill the cache (spec 002,
      # 2026-11-06 amendment, criterion 102), so it needs one: local Supabase, as in
      # the e2e job.
      - name: Fake Google provider values (spec 005, never real credentials)
        run: cp supabase/.env.example supabase/.env
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,realtime,logflare,vector,edge-runtime,mailpit,postgres-meta,supavisor
      - name: Read the local URL and public anon key
        # Public demo keys of the local stack; they are not secrets.
        run: |
          eval "$(npx supabase status -o env | sed -n 's/^\(API_URL\|ANON_KEY\)=/export LOCAL_\1=/p')"
          echo "NEXT_PUBLIC_SUPABASE_URL=${LOCAL_API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${LOCAL_ANON_KEY}" >> "$GITHUB_ENV"
      # Criterion 102: a build that cannot read the database fails, so production
      # keeps the previous deployment instead of serving an empty catalog. An address
      # nothing listens on must stop the build at the catalog read.
      - name: A build that cannot read the database fails (spec 002, criterion 102)
        run: |
          if NEXT_PUBLIC_SUPABASE_ANON_KEY=unreachable NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:1 npm run build > "$RUNNER_TEMP/unreachable-build.log" 2>&1; then
            echo "::error::The build succeeded with an unreachable database; it must fail (spec 002, criterion 102)"
            exit 1
          fi
          grep -q "Error occurred prerendering page" "$RUNNER_TEMP/unreachable-build.log" || {
            cat "$RUNNER_TEMP/unreachable-build.log"
            echo "::error::The build failed, but not at the catalog read"
            exit 1
          }
      # Build before typecheck: Next generates the global LayoutProps type
      # (.next/types) during the build, and a clean checkout does not have it.
      - run: npm run build
      - run: npm run typecheck
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/traceability.mjs

  tests-with-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check that code changes come with tests
        # Only meaningful on pull requests; on pushes to main it is a no-op.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          export CHANGED_FILES
          node scripts/tests-with-changes.mjs

  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check that no existing test was weakened or removed
        # Only meaningful on pull requests; on pushes to main it is a no-op.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git diff -U0 "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/pr.diff"
          DIFF_FILE="$RUNNER_TEMP/pr.diff" node scripts/test-integrity.mjs

  # Spec 003. Local Supabase in Docker (the CLI is a devDependency). Only the
  # services the tests need are started, to keep the job fast.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fake Google provider values (spec 005, never real credentials)
        run: cp supabase/.env.example supabase/.env
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,realtime,logflare,vector,edge-runtime,mailpit,postgres-meta,supavisor
      - name: Reset from migrations and seed
        run: npx supabase db reset
      - name: Integration tests
        run: npm run test:integration
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fake Google provider values (spec 005, never real credentials)
        run: cp supabase/.env.example supabase/.env
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,realtime,logflare,vector,edge-runtime,mailpit,postgres-meta,supavisor
      - name: Clean reset from the migrations alone (no seed)
        run: npx supabase db reset --no-seed
      # Categories were dropped in #65 (spec 001, amendment of 2026-10-31): no
      # category table and no product.category_id are left.
      - name: The migrations leave no categories and no seed rows
        run: |
          docker exec supabase_db_marcandoandoweb psql -U postgres -tA -c \
            "select (to_regclass('public.category') is null) || ',' || (select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'product' and column_name = 'category_id') || ',' || (select count(*) from public.product) || ',' || (select count(*) from auth.users)" \
            | tee /dev/stderr | grep -qx 'true,0,0,0'
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  # Spec 003. Production build started against local Supabase, Playwright at
  # 360 and 1280 px (see playwright.config.ts), axe checks inside the tests.
  # The owner must add `e2e` to the required checks after this merges.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fake Google provider values (spec 005, never real credentials)
        run: cp supabase/.env.example supabase/.env
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,realtime,logflare,vector,edge-runtime,mailpit,postgres-meta,supavisor
      - name: Reset from migrations and seed
        run: npx supabase db reset
      - name: Read the local URL and public anon key
        # Public demo keys of the local stack; they are not secrets.
        run: |
          eval "$(npx supabase status -o env | sed -n 's/^\(API_URL\|ANON_KEY\)=/export LOCAL_\1=/p')"
          echo "NEXT_PUBLIC_SUPABASE_URL=${LOCAL_API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${LOCAL_ANON_KEY}" >> "$GITHUB_ENV"
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Playwright (starts the production server)
        run: npm run test:e2e
      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
